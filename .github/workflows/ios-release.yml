name: NAYVO iOS upload
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New App Store version (higher than the published version)'
        required: true
      build_number:
        description: 'Unused numeric iOS build number'
        required: true
      upload:
        description: 'Upload to App Store Connect after building'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nayvo-ios-release
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_PUBLIC_DOMAIN: nayvo.store
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, sys
          names = ['ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_PRIVATE_KEY', 'IOS_CERTIFICATE_BASE64', 'IOS_CERTIFICATE_PASSWORD', 'IOS_PROFILE_BASE64']
          missing = [n for n in names if not os.environ.get(n)]
          if missing:
              sys.exit('Missing GitHub Secrets: ' + ', '.join(missing))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install dependencies
        run: |
          npm ci
          gem install fastlane -v 2.228.0 --no-document
          gem install cocoapods -v 1.16.2 --no-document
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const version = process.env.RELEASE_VERSION;
          const build = process.env.RELEASE_BUILD;
          if (!/^\d+\.\d+\.\d+$/.test(version) || !/^[1-9]\d{0,8}$/.test(build)) throw Error('Invalid version or build number');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          if (config.expo.ios.bundleIdentifier !== 'app.replit.forsa') throw Error('Unexpected bundle identifier');
          config.expo.version = version;
          config.expo.ios.buildNumber = build;
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          JS
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: pod install --project-directory=ios
      - name: Install signing identity
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: python3 scripts/ci/install-ios-signing.py
      - name: Build signed IPA
        run: fastlane ios package_release
      - uses: actions/upload-artifact@v4
        with:
          name: NAYVO-iOS-${{ inputs.version }}-${{ inputs.build_number }}
          path: build/NAYVO.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: fastlane ios upload_release
      - name: Remove temporary signing files
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nayvo-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/nayvo-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/nayvo-signing.p12" "$RUNNER_TEMP/nayvo.mobileprovision" "$RUNNER_TEMP/nayvo-profile.plist"
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
